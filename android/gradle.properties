# Disable the Gradle daemon for CI / constrained environments and for
# scripts that rebuild the APK via androiddeployqt.
org.gradle.daemon=false

# The app .so is ~280 MB before stripping, and :packageRelease failed intermittently
# on the first run after it changed (PackageAndroidArtifact$IncrementalSplitterRunnable),
# then succeeded unchanged on a retry — the signature of a worker running out of room.
# A daemon-less Gradle otherwise takes the JVM default max heap, which is a fraction of
# system RAM.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m

# Bounded workers, not one per core: the packaging step is I/O- and memory-heavy rather
# than CPU-bound, and this build shares the machine with the ninja compile.
org.gradle.parallel=false
org.gradle.workers.max=4
